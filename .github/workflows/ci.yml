name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[llm,app,dev]"
      - name: Tests (no API key, no network needed)
        run: python -m pytest -q
      - name: Rules baseline on the fictional sample
        run: contractiq evaluate samples/fictional_rfp.pdf --gold samples/gold.json
